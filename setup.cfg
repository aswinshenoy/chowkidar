[metadata]
name = chowkidar-strawberry
version = 0.3.3
description = All-in-One JWT Authentication plugin for Strawberry
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/traboda/chowkidar
author = Ashwin Shenoy
author_email = ashwin@traboda.com
maintainer = Ashwin Shenoy
maintainer_email = ashwin@traboda.com
license = GNU-GPL-V3
classifiers =
    Environment :: Web Environment
    Intended Audience :: Developers
    Development Status :: 4 - Beta
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Framework :: Django
    Framework :: Django :: 5.0
    Framework :: Django :: 6.0

[options]
include_package_data = true
packages = find:
zip_safe = False
install_requires =
    Django>=5.0.0
    PyJWT>=2.8.0
    strawberry-graphql>=0.312.3

[options.extras_require]
dev =
    ruff
    pre-commit
    pytest
    pytest-cov
    parameterized

[tool:pytest]
addopts = --cov=chowkidar --cov-report=term-missing
testpaths = tests
